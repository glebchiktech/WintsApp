<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Direct Sender</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        h1 { font-size: 24px; font-weight: 300; color: #00a4ef; text-transform: uppercase; margin-bottom: 20px; }
        .card { background: #1f1f1f; padding: 16px; margin-bottom: 20px; border-left: 4px solid #00a4ef; }
        label { display: block; font-size: 13px; color: #ccc; margin-bottom: 6px; }
        input, textarea {
            width: 100%; background: #2b2b2b; border: 1px solid #3d3d3d; color: #fff;
            padding: 12px; font-size: 15px; margin-bottom: 14px; outline: none;
        }
        button {
            width: 100%; background-color: #00a4ef; color: #fff; border: none;
            padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; text-transform: uppercase;
        }
        button:disabled { background-color: #444; cursor: not-allowed; }
        .status-box {
            display: none;
            padding: 12px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        .success { background: #1b5e20; color: #4caf50; border: 1px solid #4caf50; }
        .error { background: #b71c1c; color: #ff5252; border: 1px solid #ff5252; }
        .qr-container { text-align: center; display: none; }
        .qr-container img { width: 220px; height: 220px; margin-top: 10px; background: #fff; padding: 10px; }
    </style>
</head>
<body>

    <h1>WhatsApp Sender</h1>

    <!-- Экран подключения QR (если сервер не привязан) -->
    <div id="qrScreen" class="card qr-container">
        <div style="font-size: 14px; color: #aaa;">Сканируйте QR-код в WhatsApp на телефоне для привязки:</div>
        <img id="qrImg" src="" alt="QR Code" />
    </div>

    <!-- Форма отправки -->
    <div id="sendScreen" class="card" style="display: none;">
        <label for="phone">Номер получателя:</label>
        <input type="tel" id="phone" placeholder="77071234567" />

        <label for="message">Текст сообщения:</label>
        <textarea id="message" rows="4" placeholder="Введите текст..."></textarea>

        <button id="sendBtn" onclick="sendDirect()">Отправить сообщение</button>

        <!-- Сообщение об успешной отправке или ошибке -->
        <div id="statusBox" class="status-box"></div>
    </div>

    <script>
        // Проверяем статус сервера каждые 3 секунды
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                if (data.isReady) {
                    document.getElementById('qrScreen').style.display = 'none';
                    document.getElementById('sendScreen').style.display = 'block';
                } else if (data.qr) {
                    document.getElementById('qrScreen').style.display = 'block';
                    document.getElementById('sendScreen').style.display = 'none';
                    document.getElementById('qrImg').src = data.qr;
                }
            } catch (e) {
                console.log('Сервер недоступен...');
            }
        }

        setInterval(checkStatus, 3000);
        checkStatus();

        // Фоновая отправка сообщения
        async function sendDirect() {
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();
            const statusBox = document.getElementById('statusBox');
            const sendBtn = document.getElementById('sendBtn');

            if (!phone || !message) {
                showStatus('Заполните все поля!', false);
                return;
            }

            // Блокируем кнопку на время отправки
            sendBtn.disabled = true;
            sendBtn.textContent = 'Отправка...';
            statusBox.style.display = 'none';

            try {
                const res = await fetch('/api/send-direct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, message })
                });

                const data = await res.json();

                if (data.success) {
                    showStatus('✔ Успешно отправлено!', true);
                    document.getElementById('message').value = ''; // очищаем поле ввода
                } else {
                    showStatus('✖ Ошибка: ' + data.error, false);
                }
            } catch (e) {
                showStatus('✖ Не удалось связаться с сервером', false);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Отправить сообщение';
            }
        }

        function showStatus(text, isSuccess) {
            const statusBox = document.getElementById('statusBox');
            statusBox.textContent = text;
            statusBox.className = 'status-box ' + (isSuccess ? 'success' : 'error');
            statusBox.style.display = 'block';
        }
    </script>
</body>
</html>
