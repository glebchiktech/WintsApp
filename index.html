<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Messenger — W10M</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: 300;
            color: #00a4ef;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .card {
            background-color: #1f1f1f;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #00a4ef;
        }
        .section-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        input, textarea {
            width: 100%;
            background: #2b2b2b;
            border: 1px solid #3d3d3d;
            color: #fff;
            padding: 10px;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: #00a4ef;
        }
        button {
            width: 100%;
            background-color: #00a4ef;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:active {
            background-color: #0078d7;
        }
        .user-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #112233;
            padding: 10px;
            margin-bottom: 15px;
            border-left: 3px solid #00a4ef;
        }
        .logout-btn {
            background: none;
            border: none;
            color: #ff4444;
            font-size: 12px;
            cursor: pointer;
            width: auto;
            text-transform: uppercase;
        }
        .error-msg {
            color: #ff4444;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h1>WhatsApp Web</h1>

    <!-- ЭКРАН 1: ВХОД ПО СВОЕМУ НОМЕРУ -->
    <div id="loginScreen" class="card">
        <div class="section-title">Авторизация в системе</div>
        <p style="color: #aaa; font-size: 13px; margin-bottom: 12px;">Введите ваш номер WhatsApp для входа в профиль:</p>
        <input type="text" id="myPhoneInput" placeholder="Ваш номер (например: 77071234567)" />
        <button onclick="login()">Войти (ОК)</button>
        <div id="loginError" class="error-msg"></div>
    </div>

    <!-- ЭКРАН 2: ОТПРАВКА СООБЩЕНИЙ (скрыт по умолчанию) -->
    <div id="appScreen" style="display: none;">
        
        <!-- Профиль текущего пользователя -->
        <div class="user-badge">
            <div>
                <span style="font-size: 11px; color: #888; display: block;">АКТИВНЫЙ ПРОФИЛЬ</span>
                <span id="displayMyPhone" style="font-weight: 600;">+70000000000</span>
            </div>
            <button class="logout-btn" onclick="logout()">Сменить</button>
        </div>

        <!-- Форма для сообщения -->
        <div class="card">
            <div class="section-title">Новое сообщение</div>
            
            <label style="font-size: 12px; color: #aaa; margin-bottom: 4px; display: block;">Номер получателя:</label>
            <input type="text" id="recipientPhoneInput" placeholder="7707xxxxxxx" />

            <label style="font-size: 12px; color: #aaa; margin-bottom: 4px; display: block;">Текст сообщения:</label>
            <textarea id="messageInput" rows="4" placeholder="Введите текст..."></textarea>
            
            <button onclick="sendToRecipient()">Отправить сообщение</button>
            <div id="sendError" class="error-msg"></div>
        </div>
    </div>

    <script>
        // Проверяем, есть ли уже сохранённый номер в браузерной памяти
        window.onload = function() {
            const savedPhone = localStorage.getItem('wa_my_phone');
            if (savedPhone) {
                autoLogin(savedPhone);
            }
        };

        // Вход пользователя
        async function login() {
            const myPhone = document.getElementById('myPhoneInput').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (!myPhone) {
                errorDiv.textContent = 'Введите номер телефона!';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ myPhone })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('wa_my_phone', data.user.phone);
                    showAppScreen(data.user.phone);
                } else {
                    errorDiv.textContent = data.error || 'Ошибка входа';
                }
            } catch (e) {
                errorDiv.textContent = 'Ошибка подключения к серверу';
            }
        }

        async function autoLogin(phone) {
            document.getElementById('myPhoneInput').value = phone;
            await login();
        }

        function showAppScreen(phone) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            document.getElementById('displayMyPhone').textContent = '+' + phone;
        }

        function logout() {
            localStorage.removeItem('wa_my_phone');
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('appScreen').style.display = 'none';
            document.getElementById('myPhoneInput').value = '';
        }

        // Отправка получателю
        async function sendToRecipient() {
            const senderPhone = localStorage.getItem('wa_my_phone');
            const recipientPhone = document.getElementById('recipientPhoneInput').value.trim();
            const message = document.getElementById('messageInput').value.trim();
            const errorDiv = document.getElementById('sendError');

            if (!recipientPhone) {
                errorDiv.textContent = 'Укажите номер получателя!';
                return;
            }

            errorDiv.textContent = '';

            try {
                const res = await fetch('/api/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senderPhone, recipientPhone, message })
                });
                const data = await res.json();

                if (data.success) {
                    // Открываем диалог с переданным текстом
                    window.open(data.waUrl, '_blank');
                } else {
                    errorDiv.textContent = data.error || 'Ошибка при отправке';
                }
            } catch (e) {
                errorDiv.textContent = 'Не удалось связаться с сервером';
            }
        }
    </script>
</body>
</html>
