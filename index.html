<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WP Telegram - Auth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Segoe, Tahoma, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0078d7;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    #auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: 300;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 12px;
      color: #aaaaaa;
      margin-bottom: 20px;
      max-width: 280px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      max-width: 280px;
      padding: 12px;
      background: #111;
      border: 1px solid #444;
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
      letter-spacing: 1px;
    }

    input:focus {
      border-color: #0078d7;
    }

    .btn {
      width: 100%;
      max-width: 280px;
      padding: 12px;
      background: #0078d7;
      color: white;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .btn:active {
      background: #005a9e;
    }

    #app-screen {
      display: none;
      flex: 1;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>Telegram WP</header>

  <div id="auth-screen">
    
    <!-- ЭТАП 1: Ввод телефона -->
    <div id="step-phone">
      <div class="title">Вход в Telegram</div>
      <div class="subtitle">Введите ваш номер телефона для получения кода</div>
      
      <!-- Поле с авто-маской -->
      <input type="text" id="phone-input" placeholder="+7 (___) ___-__-__" maxlength="18">
      <button class="btn" onclick="requestTelegramCode()">Получить код</button>
    </div>

    <!-- ЭТАП 2: Ввод кода из Telegram (скрыт сначала) -->
    <div id="step-code" style="display: none;">
      <div class="title">Проверка кода</div>
      <div class="subtitle" id="code-sent-to">Мы отправили код в приложение Telegram</div>
      
      <input type="number" id="code-input" placeholder="Код подтверждения" maxlength="5">
      <button class="btn" onclick="submitTelegramCode()">Войти</button>
    </div>

  </div>

  <!-- ЭКРАН ЧАТОВ ПОСЛЕ УСПЕШНОГО ВХОДА -->
  <div id="app-screen">
    <h2 style="color: #0078d7;">Добро пожаловать!</h2>
    <p style="margin-top: 10px; color: #ccc;">Вы успешно авторизовались в Telegram аккаунте.</p>
  </div>

  <script>
    const phoneInput = document.getElementById('phone-input');
    let rawPhoneNumber = "";
    let phoneCodeHash = "";

    // 📱 Маска форматирования телефона во время ввода (+7 (XXX) XXX-XX-XX)
    phoneInput.addEventListener('input', (e) => {
      let x = e.target.value.replace(/\D/g, '').match(/(\d{0,1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})/);
      
      if (!x[2]) {
        e.target.value = x[1] ? '+' + x[1] : '';
      } else {
        e.target.value = !x[3] 
          ? `+${x[1]} (${x[2]}` 
          : `+${x[1]} (${x[2]}) ${x[3]}` + (x[4] ? `-${x[4]}` : '') + (x[5] ? `-${x[5]}` : '');
      }

      // Сохраняем чистый номер без скобок и тире для отправки на сервер
      rawPhoneNumber = '+' + e.target.value.replace(/\D/g, '');
    });

    // 1. Отправка запроса на сервер для получения кода в Telegram
    async function requestTelegramCode() {
      if (rawPhoneNumber.length < 11) {
        alert("Пожалуйста, введите полный номер телефона!");
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/send-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: rawPhoneNumber })
        });

        const data = await response.json();

        if (data.success) {
          phoneCodeHash = data.phoneCodeHash;
          document.getElementById('step-phone').style.display = 'none';
          document.getElementById('step-code').style.display = 'block';
          document.getElementById('code-sent-to').innerText = `Код отправлен на ${phoneInput.value}`;
        } else {
          alert('Ошибка Telegram API: ' + data.error);
        }
      } catch (err) {
        alert('Не удалось связаться с локальным сервером авторизации.');
      }
    }

    // 2. Отправка введенного кода на сервер для входа
    async function submitTelegramCode() {
      const code = document.getElementById('code-input').value;

      if (!code || code.length < 5) {
        alert("Введите 5-значный код из сообщения!");
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: rawPhoneNumber,
            code: code,
            phoneCodeHash: phoneCodeHash
          })
        });

        const data = await response.json();

        if (data.success) {
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('app-screen').style.display = 'block';
        } else {
          alert('Неверный код или ошибка: ' + data.error);
        }
      } catch (err) {
        alert('Ошибка при проверке кода.');
      }
    }
  </script>
</body>
</html>
