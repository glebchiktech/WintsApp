<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Redirect — W10M</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 26px;
            font-weight: 300;
            color: #00a4ef;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1f1f1f;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #00a4ef;
        }
        .section-title {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        input, textarea {
            width: 100%;
            background: #2b2b2b;
            border: 1px solid #3d3d3d;
            color: #fff;
            padding: 10px;
            font-size: 15px;
            margin-bottom: 10px;
            outline: none;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: #00a4ef;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #00a4ef;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            margin-top: 5px;
        }
        .btn-secondary {
            background-color: #25D366; /* Зеленый цвет WhatsApp */
            margin-top: 10px;
        }
        .btn:active {
            opacity: 0.8;
        }
        #resultArea {
            display: none;
            margin-top: 15px;
        }
        #status {
            font-size: 13px;
            margin-top: 8px;
            color: #ff4444;
        }
    </style>
</head>
<body>

    <h1>WhatsApp Web Direct</h1>

    <div class="card">
        <div class="section-title">Отправка на номер</div>
        <input type="text" id="phone" placeholder="Номер (например: 77071234567 или 8707...)" />
        <textarea id="message" rows="3" placeholder="Введите текст сообщения (необязательно)..."></textarea>
        
        <button class="btn" onclick="generateLink()">Открыть чат</button>
        <div id="status"></div>

        <!-- Секция с полученными ссылками -->
        <div id="resultArea">
            <div class="section-title" style="margin-top: 15px;">Выберите вариант:</div>
            
            <!-- Прямой переход по wa.me (работает везде) -->
            <a id="waDirectBtn" href="#" target="_blank" class="btn btn-secondary">Открыть в WhatsApp (Мобильный / Приложение)</a>
            
            <!-- Переход на web.whatsapp.com (для ПК) -->
            <a id="waWebBtn" href="#" target="_blank" class="btn" style="background:#333; margin-top:8px;">Открыть WhatsApp Web (Браузер)</a>
        </div>
    </div>

    <script>
        async function generateLink() {
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();
            const statusDiv = document.getElementById('status');
            const resultArea = document.getElementById('resultArea');

            if (!phone) {
                statusDiv.textContent = 'Укажите номер телефона!';
                resultArea.style.display = 'none';
                return;
            }

            statusDiv.textContent = '';

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, message })
                });

                const data = await response.json();

                if (data.success) {
                    // Устанавливаем ссылки на кнопки
                    document.getElementById('waDirectBtn').href = data.waDirectUrl;
                    document.getElementById('waWebBtn').href = data.waWebUrl;
                    
                    resultArea.style.display = 'block';

                    // Автоматическое перенаправление на прямую ссылку
                    window.open(data.waDirectUrl, '_blank');
                } else {
                    statusDiv.textContent = data.error || 'Ошибка';
                }
            } catch (e) {
                statusDiv.textContent = 'Ошибка соединения с сервером';
            }
        }
    </script>
</body>
</html>
