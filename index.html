<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wintsapp Direct</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        h1 {
            font-size: 26px;
            font-weight: 300;
            color: #00a4ef;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .card {
            background: #1f1f1f;
            padding: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #00a4ef;
        }
        .section-title {
            font-size: 12px;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        label { display: block; font-size: 13px; color: #ccc; margin-bottom: 6px; }
        input, textarea {
            width: 100%;
            background: #2b2b2b;
            border: 1px solid #3d3d3d;
            color: #fff;
            padding: 12px;
            font-size: 15px;
            margin-bottom: 14px;
            outline: none;
            font-family: inherit;
        }
        input:focus, textarea:focus { border-color: #00a4ef; }
        button {
            width: 100%;
            background-color: #00a4ef;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:disabled { background: #444; cursor: not-allowed; }
        button:active { background-color: #0078d7; }
        
        .status-badge {
            font-size: 12px;
            padding: 4px 8px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .online { background: #1b5e20; color: #4caf50; }
        .offline { background: #b71c1c; color: #ff5252; }

        .alert {
            display: none;
            padding: 12px;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        .alert-success { background: #1b5e20; color: #4caf50; border: 1px solid #4caf50; }
        .alert-error { background: #b71c1c; color: #ff5252; border: 1px solid #ff5252; }
    </style>
</head>
<body>

    <h1>Wintsapp</h1>
    <div id="connectionStatus" class="status-badge offline">ПРОВЕРКА СОЕДИНЕНИЯ...</div>

    <div class="card">
        <div class="section-title">Отправка сообщения</div>

        <label for="phone">Номер получателя:</label>
        <input type="tel" id="phone" placeholder="77071234567" />

        <label for="message">Текст сообщения:</label>
        <textarea id="message" rows="4" placeholder="Введите текст..."></textarea>

        <button id="sendBtn" onclick="sendMessage()">Отправить</button>
        <div id="alertBox" class="alert"></div>
    </div>

    <script>
        // Проверка подключения сервера
        async function checkServerStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const badge = document.getElementById('connectionStatus');

                if (data.isConnected) {
                    badge.textContent = 'СЕРВЕР ПОДКЛЮЧЕН К WA';
                    badge.className = 'status-badge online';
                } else {
                    badge.textContent = 'ТРЕБУЕТСЯ СКАНИРОВАНИЕ QR В ТЕРМИНАЛЕ';
                    badge.className = 'status-badge offline';
                }
            } catch (e) {
                const badge = document.getElementById('connectionStatus');
                badge.textContent = 'СЕРВЕР ОФЛАЙН';
                badge.className = 'status-badge offline';
            }
        }

        setInterval(checkServerStatus, 3000);
        checkServerStatus();

        // Отправка формы
        async function sendMessage() {
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();
            const alertBox = document.getElementById('alertBox');
            const sendBtn = document.getElementById('sendBtn');

            if (!phone || !message) {
                showAlert('Заполните номер и текст сообщения!', false);
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = 'Отправка...';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, message })
                });

                const data = await res.json();

                if (data.success) {
                    showAlert('✔ Сообщение успешно отправлено!', true);
                    document.getElementById('message').value = '';
                } else {
                    showAlert('✖ Ошибка: ' + data.error, false);
                }
            } catch (e) {
                showAlert('✖ Не удалось отправить запрос на сервер', false);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Отправить';
            }
        }

        function showAlert(text, isSuccess) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = text;
            alertBox.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
