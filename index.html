<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WP Telegram Light</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Segoe, Tahoma, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0078d7;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    #auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: 300;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 12px;
      color: #aaaaaa;
      margin-bottom: 20px;
      max-width: 280px;
      line-height: 1.4;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      max-width: 280px;
      padding: 12px;
      background: #111;
      border: 1px solid #444;
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
      letter-spacing: 1px;
      border-radius: 0;
    }

    input:focus {
      border-color: #0078d7;
    }

    .btn {
      width: 100%;
      max-width: 280px;
      padding: 12px;
      background: #0078d7;
      color: white;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .btn:active {
      background: #005a9e;
    }

    #app-screen {
      display: none;
      flex: 1;
      padding: 20px;
    }

    .chat-item {
      padding: 12px;
      border-bottom: 1px solid #222;
    }
  </style>
</head>
<body>

  <header>Telegram WP</header>

  <div id="auth-screen">
    
    <!-- Шаг 1: Номер телефона -->
    <div id="step-phone">
      <div class="title">Вход в Telegram</div>
      <div class="subtitle">Введите ваш номер телефона для получения кода</div>
      
      <input type="text" id="phone-input" placeholder="+7 (___) ___-__-__" maxlength="18">
      <button class="btn" id="send-code-btn" onclick="requestTelegramCode()">Получить код</button>
    </div>

    <!-- Шаг 2: Ввод кода -->
    <div id="step-code" style="display: none;">
      <div class="title">Проверка кода</div>
      <div class="subtitle" id="code-sent-to">Мы отправили код в приложение Telegram</div>
      
      <input type="number" id="code-input" placeholder="Код подтверждения" maxlength="5">
      <button class="btn" id="login-btn" onclick="submitTelegramCode()">Войти</button>
    </div>

  </div>

  <!-- Главный экран после входа -->
  <div id="app-screen">
    <h2 style="color: #0078d7;">Чаты</h2>
    <div class="chat-item" style="margin-top: 15px;">
      <div style="font-weight: bold;">Избранное</div>
      <div style="font-size: 12px; color: #888;">Вы успешно авторизовались через Telegram API!</div>
    </div>
  </div>

  <script>
    // ⚙️ НАСТРОЙКА: Если открываешь со смартфона, укажи IP компьютера вместо localhost (например: "192.168.1.15")
    const SERVER_IP = "localhost"; 
    const API_URL = `http://${SERVER_IP}:3000/api`;

    const phoneInput = document.getElementById('phone-input');
    let rawPhoneNumber = "";
    let phoneCodeHash = "";

    // Маска форматирования телефона
    phoneInput.addEventListener('input', (e) => {
      let x = e.target.value.replace(/\D/g, '').match(/(\d{0,1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})/);
      
      if (!x[2]) {
        e.target.value = x[1] ? '+' + x[1] : '';
      } else {
        e.target.value = !x[3] 
          ? `+${x[1]} (${x[2]}` 
          : `+${x[1]} (${x[2]}) ${x[3]}` + (x[4] ? `-${x[4]}` : '') + (x[5] ? `-${x[5]}` : '');
      }

      rawPhoneNumber = '+' + e.target.value.replace(/\D/g, '');
    });

    // Запрос кода в Telegram
    async function requestTelegramCode() {
      if (rawPhoneNumber.length < 11) {
        alert("Пожалуйста, введите полный номер телефона!");
        return;
      }

      const btn = document.getElementById('send-code-btn');
      btn.innerText = "Отправка...";
      btn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/send-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: rawPhoneNumber })
        });

        const data = await response.json();

        if (data.success) {
          phoneCodeHash = data.phoneCodeHash;
          document.getElementById('step-phone').style.display = 'none';
          document.getElementById('step-code').style.display = 'block';
          document.getElementById('code-sent-to').innerText = `Код отправлен на ${phoneInput.value}`;
        } else {
          alert('Ошибка Telegram API: ' + data.error);
          btn.innerText = "Получить код";
          btn.disabled = false;
        }
      } catch (err) {
        alert('Не удалось связаться с сервером! Проверьте, запущен ли node server.js');
        btn.innerText = "Получить код";
        btn.disabled = false;
      }
    }

    // Подтверждение кода
    async function submitTelegramCode() {
      const code = document.getElementById('code-input').value;

      if (!code || code.length < 5) {
        alert("Введите 5-значный код из сообщения!");
        return;
      }

      const btn = document.getElementById('login-btn');
      btn.innerText = "Проверка...";
      btn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: rawPhoneNumber,
            code: code,
            phoneCodeHash: phoneCodeHash
          })
        });

        const data = await response.json();

        if (data.success) {
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('app-screen').style.display = 'block';
        } else {
          alert('Неверный код или ошибка: ' + data.error);
          btn.innerText = "Войти";
          btn.disabled = false;
        }
      } catch (err) {
        alert('Ошибка при проверке кода на сервере.');
        btn.innerText = "Войти";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
